function appendSourceShapeLegend(container){const detail=el('details',undefined,'source-shape-legend');detail.append(el('summary','Source issue：線框、圓柱、接縫各代表什麼'));const table=el('table'),head=el('thead'),headRow=el('tr');headRow.append(el('th','形狀／在哪張圖'),el('th','含義與 authority'));head.append(headRow);table.append(head);const rows=[['舊 closeup 的青藍色線框盒','待 HR-01 核准的 body guard／人物包絡；不是牆、collider 或 navigation domain。'],['白色矩形','Prospective footpoint domain，限定落點範圍；不是 source 物件。'],['紫色接縫：faces 1975／2398','共線、零面積 source triangles。顯示線加粗／上移只為可見，不能按圖上厚度認定牆體。'],['新行走動畫的紫色線框盒','同一待審 body guard；與舊 closeup 用色不同，authority 未升級。'],['人物內圈／body cylinder','半徑 0.30 m、高 1.70 m。行走動畫 OBSERVED 青藍色／GAP 橙色；人形僅供顯示。'],['淡黃色外圈／clearance cylinder','外半徑 0.35 m、包絡高 1.75 m（0.05 m clearance）；不是另一個人或障礙物。'],['藍／青色 projected dots','既有 public observations 的投影位置；不是 GT 或已核准 footpoint。'],['綠色支撐面','已核准 local floor support；不代表整條候選或整層樓已認證。'],['OBSTACLE 輪廓','Annotation context；office approved solid components 仍為 0。']];const body=el('tbody');for(const [shape,meaning]of rows){const row=el('tr');row.append(el('td',shape),el('td',meaning));body.append(row);}table.append(body);detail.append(table);container.append(detail);}
function drawHR02ContactCallout(svg,record){const projection=record.display_projection;if(!projection)return;const create=(tag,attrs,text)=>{const node=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [key,value]of Object.entries(attrs))node.setAttribute(key,String(value));if(text!==undefined)node.textContent=text;svg.append(node);};svg.setAttribute('viewBox','0 0 '+record.width+' '+record.height);const foot=projection.foot_pixel,top=projection.body_top_pixel;create('circle',{cx:foot[0],cy:foot[1],r:12,fill:'#fbef5b',stroke:'#172e3e','stroke-width':6,'data-role':'hr02-foot-callout'});create('circle',{cx:foot[0],cy:foot[1],r:12,fill:'#fbef5b',stroke:'white','stroke-width':3});const lx=Math.min(record.width-475,foot[0]+230),ly=Math.min(record.height-54,foot[1]+22);const leader='M'+foot[0]+','+foot[1]+' L'+(lx-14)+','+(ly-12)+' L'+lx+','+(ly-12);create('path',{d:leader,fill:'none',stroke:'white','stroke-width':6});create('path',{d:leader,fill:'none',stroke:'#204b64','stroke-width':2});create('rect',{x:lx-8,y:ly-36,width:452,height:54,rx:7,fill:'white','fill-opacity':.95,stroke:'#88a7b9'});create('text',{x:lx+6,y:ly-3,fill:'#164d68','font-size':25,'font-family':'system-ui,sans-serif','font-weight':750},'候選腳底落點 · HR-02 待核准');const ruler=Math.max(150,foot[0]-170),line='M'+ruler+','+top[1]+' V'+foot[1]+' M'+(ruler-9)+','+top[1]+' H'+(ruler+9)+' M'+(ruler-9)+','+foot[1]+' H'+(ruler+9);create('path',{d:line,fill:'none',stroke:'white','stroke-width':7});create('path',{d:line,fill:'none',stroke:'#96519b','stroke-width':3});create('text',{x:ruler-16,y:(top[1]+foot[1])/2,'text-anchor':'end',fill:'#834187','font-size':25,'font-family':'system-ui,sans-serif','font-weight':750,stroke:'white','stroke-width':4,'paint-order':'stroke'},'Body policy 1.70 m');}
function appendHR02BodyView(container){if(!reviewClarity.hr02)return;const record=reviewClarity.hr02,path=safeLocalPath(record.path);if(!path)return;const card=el('section',undefined,'body-clarity');card.setAttribute('data-role','hr02-body-clarity');card.append(el('h3','HR-02：人物、landmark 與 approved floor 的顯示比例'));const figure=el('figure'),model=el('a',undefined,'body-evidence-model'),img=el('img'),svg=document.createElementNS('http://www.w3.org/2000/svg','svg');model.href=path;model.target='_blank';model.rel='noopener';img.src=path;img.alt='HR-02 source-model person with exact projected prospective foot contact';img.loading='lazy';svg.setAttribute('class','body-contact-overlay');svg.setAttribute('role','img');svg.setAttribute('aria-label','Exact projected prospective footpoint and approved body policy height');drawHR02ContactCallout(svg,record);model.append(img,svg);figure.append(model,el('figcaption','新 source-model 側視：沿用 frame 20 的候選腳底與行走動畫人形。Marker 在 prospective footpoint 上方 1.359735 m；body policy 高 1.70 m，姿勢僅為 DISPLAY_ONLY。'));card.append(figure,el('p','Floor support 已核准；marker／footpoint 語意與 camera binding 仍 pending HR-02。腳底標記由本圖相機矩陣投影，不調整來源位置。'));container.append(card);}

function initSharedVisualWorkspace(){const host=document.getElementById('visual-review-workspace');if(!host)return;host.append(el('h2','共同視覺審查工作區'),el('p','建議順序：空間定位 → 10 秒行走 → 模型／拓樸對照 → HR-01／HR-02 接縫與 binding。切換檢視會停止前一段播放；所有畫面皆為 GT-free diagnostic。'),el('div','1.36 m＝landmark 到待核准人物落點的垂直座標差，不是樓板到天花板高度。Body policy 高 1.70 m；人物比例看「4 接縫／binding」的 HR-02。','review-clarification'));sharedMediaWorkspace=mountMediaTabs(host,[...reviewMediaViews,{id:'issues',label:'4 接縫／binding',description:'只對照現有 HR-01／HR-02 的人工問題；此處不套用 authority 或記錄決策。',render:renderSharedIssueFocus},...hr02CameraViews],{id:'shared-review',initialView:'motion'});}

function openItem(id){stopAllReviewMedia();activeItem=id;const item=documentState.items.find(i=>i.id===id);document.getElementById('item-title').textContent=item.id+' — '+item.title;const body=document.getElementById('item-content');body.replaceChildren();const location=section('Location:');const dl=el('dl',undefined,'location');for(const k of ['floor','area','portal','nearby_object','outliner_search']){dl.append(el('dt',fieldLabels[k]));const dd=el('dd');const v=item.location?.[k];dd.textContent=Array.isArray(v)?v.join(' / '):(v??'N/A');dl.append(dd);}location.append(dl);body.append(location);

const human=section('Human choices:');const select=el('select');select.id='decision-select';select.setAttribute('aria-label','Human decision');const blank=el('option','請選擇決策');blank.value='';select.append(blank);for(const choice of allowed){const option=el('option',choice);option.value=choice;select.append(option);}select.value=item.decision||'';human.append(select);const profiles=el('div');profiles.id='approve-profiles';human.append(profiles,el('p','只有按「儲存此決策」才會記錄；不會自動核准或套用 authority。','choice-note'));body.append(human);
function renderProfiles(){profiles.replaceChildren();if(select.value!=='APPROVE')return;const options=item.approve_options||[];if(!options.length){profiles.append(el('p','APPROVE 核准上方已完整列出的 payload。'));return;}profiles.append(el('p','選擇 APPROVE 的明確設定：'));for(const option of options){const profile=el('div',undefined,'profile'),label=el('label'),radio=el('input');radio.type='radio';radio.name='approval-profile';radio.value=option.id;radio.checked=option.id===(item.selected_option||item.recommended_option);label.append(radio,el('span',option.label));if(option.id===item.recommended_option)label.append(el('span','建議','recommended'));profile.append(label);if(option.why)structuredValue(profile,option.why);if(option.payload!==undefined){const detail=el('details');detail.append(el('summary','完整設定 payload'));structuredValue(detail,option.payload);profile.append(detail);}profiles.append(profile);} }
