<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amidst · 局部跨鏡頭事件 pilot</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101923;color:#e2eaf2}body{max-width:1300px;margin:auto;padding:28px}h1{font-size:25px}p{line-height:1.55;color:#b5c6d6}button,select,input{font:inherit;color:inherit;background:#243748;border:1px solid #416079;border-radius:6px;padding:8px}button{cursor:pointer}button:hover{background:#35536b}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.badge{font-size:12px;background:#273e50;padding:5px 9px;border-radius:20px}article{margin:18px 0;padding:18px;background:#192838;border:1px solid #324b62;border-radius:12px}.photos{display:flex;gap:10px;overflow:auto}.photo{min-width:180px;max-width:240px}.photo img{width:100%;border-radius:6px}.photo small{display:block;overflow-wrap:anywhere;color:#a8bdcd}.content{display:grid;grid-template-columns:1fr 360px;gap:20px}canvas{width:100%;height:260px;background:#111c27;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#a8bdcd}details{margin-top:12px}#message{white-space:pre-wrap}#context{font-size:12px}footer{margin:30px 0;font-size:12px;color:#a8bdcd}@media(max-width:850px){.content{grid-template-columns:1fr}}
</style>
<h1>局部跨鏡頭人物關聯與事件</h1>
<p>可操作的合成研究 pilot。只用 RGB 人物量測、已配置拓樸與時間；人物關聯保留歧義。門界、投影及路徑只具合成配置 authority。</p>
<div class="bar"><label>輸入模式 <select id="mode"><option>photos_only</option><option>photos_plus_observations</option></select></label><button id="resolve">1 地點定位</button><button id="cameras">2 取得局部鏡頭</button><select id="camera"></select><label>秒 <input id="start" type="number" value="0" min="0" style="width:60px"> – <input id="end" type="number" value="60" min="0" style="width:60px"></label><button id="query">3 查詢事件與證據</button></div>
<p id="context"></p><p id="message" role="status">載入中…</p><div id="cards"></div><details><summary>工具紀錄</summary><pre id="log"></pre></details>
<footer>實際照片為 SYNTHETIC RGB；局部 3D 為 PROJECTED / INFERRED_GAP。分數未校準；可能遊蕩不代表意圖。Formal Cases 2/3、full Exit BLOCKED；Case 4 DEFERRED；frozen Phase 2 保持有效。</footer>
<script>
let ctx, history=[];
const $=id=>document.getElementById(id);
function node(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
async function call(tool,payload={}){const response=await fetch('/api/tool/'+tool+'?mode='+encodeURIComponent($('mode').value),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_ref:ctx.session_ref,...payload})});const data=await response.json();history.push({tool,status:response.status});$('log').textContent=JSON.stringify(history,null,2);if(!response.ok)throw Error(data.error);return data}
async function load(){const response=await fetch('/api/context?mode='+encodeURIComponent($('mode').value));ctx=await response.json();$('context').textContent=`${ctx.place_id} · ${ctx.run_id} · ${ctx.clock_id} · ${ctx.observation_mode} · ${ctx.decision_stage}`;$('message').textContent='先選擇局部鏡頭，再查詢時間範圍。';$('cards').replaceChildren();await cameras()}
async function cameras(){const result=await call('list_cameras');$('camera').replaceChildren();for(const c of result.items){let o=node('option',`${c.camera_id} · ${c.coverage_status}`);o.value=c.camera_ref;$('camera').append(o)}}
function point(p){if(Array.isArray(p))return p;if(p.world_position)return p.world_position;if(p.position)return p.position;return [0,0,0]}
function draw3d(canvas,data){const c=canvas.getContext('2d'),w=720,h=520;canvas.width=w;canvas.height=h;const pr=p=>{let [x,y,z]=point(p);return [70+x*30+y*12,430-y*33-x*4-z*50]};c.lineWidth=1;c.strokeStyle='#344f67';for(let i=0;i<=16;i++){let a=pr([i,0,0]),b=pr([i,8,0]);c.beginPath();c.moveTo(...a);c.lineTo(...b);c.stroke()}for(let j=0;j<=8;j++){let a=pr([0,j,0]),b=pr([16,j,0]);c.beginPath();c.moveTo(...a);c.lineTo(...b);c.stroke()}const lines=(data.candidates||[]).map((r,i)=>({points:r.polyline,color:['#f1ac58','#4bb6df','#a9db75','#ca88df'][i%4]}));if(data.projected_path?.length && data.evidence_state!=='INFERRED_GAP')lines.push({points:data.projected_path,color:'#fff'});if(data.evidence_state==='INFERRED_GAP'){c.fillStyle='#fff';for(const p of data.projected_path||[]){const q=pr(p);c.beginPath();c.arc(...q,5,0,2*Math.PI);c.fill()}}for(const line of lines){c.strokeStyle=line.color;c.lineWidth=4;c.beginPath();line.points.forEach((p,i)=>{let q=pr(p);i?c.lineTo(...q):c.moveTo(...q)});c.stroke()}c.fillStyle='#afc3d5';c.font='20px system-ui';c.fillText(data.evidence_state+' · configured metres',30,35);c.fillText('x →   y ↗   z ↑ · white: visible samples only',30,490)}
async function render(summary){const detail=await call('get_event_detail',{event_ref:summary.event_ref});const card=node('article'),title=node('h2',summary.kind);title.style.fontSize='18px';card.append(title,node('p',`${summary.time_range[0].toFixed(2)}–${summary.time_range[1].toFixed(2)} s · ${summary.camera_ids.join(' → ')} · ${summary.evidence_state}`));const content=node('div');content.className='content';const left=node('div'),photos=node('div');photos.className='photos';for(const ref of detail.media_refs.slice(0,5)){const pic=node('div');pic.className='photo';try{const m=await call('get_media',{media_ref:ref});const img=node('img');img.src=`data:${m.mime_type};base64,${m.base64}`;img.alt=`${m.camera_id} ${m.timestamp} s actual synthetic RGB`;pic.append(img,node('small',`${m.camera_id} · ${m.timestamp.toFixed(2)} s · RGB_PIXELS`),node('small',ref))}catch(e){pic.append(node('p','照片缺失 · '+e.message))}photos.append(pic)}if(!detail.media_refs.length)photos.append(node('p','來源照片缺失；沒有生成照片替代證據。'));left.append(photos,node('p',detail.uncertainty));const support=node('details');support.append(node('summary','支持、衝突與替代假說'),node('pre',JSON.stringify({supports:detail.supports,conflicts:detail.conflicts,alternatives:detail.alternatives,association_refs:detail.association_refs,rule:detail.rule_version,config_sha256:detail.config_sha256,detail_ref:detail.detail_ref},null,2)));left.append(support);const right=node('div'),canvas=node('canvas');draw3d(canvas,detail);right.append(canvas,node('small',`局部 3D · ${detail.candidates.length} 路徑候選 · ${detail.trajectories.length} 時間假說 · 保留原順序`));const replay=node('button','取得 replay');replay.onclick=async()=>{try{const data=await call('get_replay',{event_ref:summary.event_ref,timestamp:(summary.time_range[0]+summary.time_range[1])/2});draw3d(canvas,data);$('message').textContent='Replay 已取得；顯示讀取 frozen 結果。'}catch(e){$('message').textContent=e.message}};right.append(replay);content.append(left,right);card.append(content);$('cards').append(card)}
$('mode').onchange=()=>load().catch(e=>$('message').textContent=e.message);
$('resolve').onclick=async()=>{try{const data=await call('resolve_place',{query:'lab'});$('message').textContent=JSON.stringify(data.items)}catch(e){$('message').textContent=e.message}};
$('cameras').onclick=()=>cameras().catch(e=>$('message').textContent=e.message);
$('query').onclick=async()=>{try{const data=await call('query_events',{camera_ref:$('camera').value,time_range:[Number($('start').value),Number($('end').value)]});$('cards').replaceChildren();$('message').textContent=`${data.items.length} 個局部事件 · 讀取 ${data.retrieval.records_read} records · ${data.retrieval.coverage}`;for(const item of data.items.slice(0,12))await render(item);if(data.items.length>12)$('message').textContent+=' · 顯示前12卡，請縮小時間窗查看其餘事件'}catch(e){$('message').textContent=e.message}};
load().catch(e=>$('message').textContent=e.message);
</script></html>
