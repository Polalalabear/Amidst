[project]
name = "amidst"
version = "0.1.0"
description = "Phase 1 research prototype for physically feasible blind-gap trajectory reconstruction"
authors = [
    { name = "Polalalabear", email = "polalalabear@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "rerun-sdk>=0.38.1",
    "shapely>=2.1.2,<3",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "external_physical_evidence: requires the local school-v3 source and explicitly materialized physical-policy evidence",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["amidst"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-shapely>=2.1,<3",
]
